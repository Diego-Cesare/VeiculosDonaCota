<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Cidade do Idoso Dona Cota - Controle de Veículos</title>
    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600&display=swap"
      rel="stylesheet"
    />
    <link
      href="https://fonts.googleapis.com/icon?family=Material+Icons"
      rel="stylesheet"
    />
    <!-- Biblioteca SheetJS para exportação Excel -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="mobile-container">
      <header>
        <div class="titulo">Cadastro de veiculos</div>
        <span>Cidade do Idoso Dona Cota</span>
        <nav class="floating-footer">
          <button class="nav-item active" id="btn-tab-cadastrar">
            <span class="material-icons">add_circle</span>
            Cadastrar
          </button>
          <button class="nav-item" id="btn-tab-ver">
            <span class="material-icons">list_alt</span>
            Ver Cadastros
          </button>
          <button class="nav-item" id="btn-tab-tabela">
            <span class="material-icons">table_chart</span>
            Lista
          </button>
        </nav>
      </header>
      <div class="content">
        <section id="view-cadastrar" class="view active">
          <form id="form-veiculo">
            <div class="form-group">
              <label for="condutor">Nome do Condutor</label>
              <input
                type="text"
                id="condutor"
                required
                placeholder="Digite o nome completo"
              />
            </div>

            <div class="form-group">
              <label for="veiculo">Marca e Modelo do Veículo</label>
              <input
                type="text"
                id="veiculo"
                required
                placeholder="Ex: Fiat Uno, Honda Civic"
              />
            </div>

            <div class="form-group">
              <label for="placa">Placa do Veículo</label>
              <input
                type="text"
                id="placa"
                required
                placeholder="Ex: ABC-1234 ou ABC1D23"
                style="text-transform: uppercase"
              />
            </div>

            <div class="form-group">
              <label for="cor">Cor do Veículo</label>
              <input
                type="text"
                id="cor"
                required
                placeholder="Ex: Prata, Preto, Branco"
              />
            </div>

            <div class="form-group">
              <label for="observacoes">Observações</label>
              <textarea
                id="observacoes"
                placeholder="Informações adicionais (opcional)"
              ></textarea>
            </div>

            <div class="photo-section">
              <div class="photo-preview" id="photo-preview-container">
                <span id="photo-placeholder">Nenhuma foto capturada</span>
              </div>
              <input
                type="file"
                id="camera-input"
                accept="image/*"
                capture="environment"
                style="display: none"
              />
              <button type="button" class="btn-camera" id="btn-trigger-camera">
                <span class="material-icons">photo_camera</span> Abrir Câmera
              </button>
            </div>

            <button type="submit" class="btn-submit" id="btn-submit-veiculo">
              Salvar Cadastro
            </button>
          </form>
        </section>

        <section id="view-ver" class="view">
          <div class="total">
            Total de veiculos
            <span id="total-car">0</span>
          </div>
          <div class="search-box">
            <span class="material-icons">search</span>
            <input
              type="text"
              id="search-input"
              placeholder="Pesquisar por placa, condutor"
            />
          </div>

          <div id="lista-veiculos"></div>
        </section>

        <section id="view-tabela" class="view">
          <div class="header-tabela">
            <h2>Relatório</h2>
            <button id="btn-export-excel" class="btn-excel">
              Baixar Excel
            </button>
          </div>

          <div class="table-responsive">
            <table id="tabela-veiculos">
              <thead>
                <tr>
                  <th>Condutor</th>
                  <th>Veículo</th>
                  <th>Placa</th>
                  <th>Cor</th>
                  <th>Observações</th>
                  <th>Data</th>
                </tr>
              </thead>
              <tbody id="tabela-corpo">
                <!-- Os dados serão injetados via JavaScript -->
              </tbody>
            </table>
          </div>
        </section>
      </div>
    </div>

    <div id="loading-overlay" style="display: none">Salvando dados...</div>

    <script type="module" src="script.js"></script>
  </body>
</html>
